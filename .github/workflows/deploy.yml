name: Déployer sur Cloudflare Workers

# Se déclenche à chaque push sur la branche de production, et peut aussi
# être lancé manuellement depuis l'onglet "Actions" de GitHub (bouton
# "Run workflow") — utile pour forcer un redéploiement sans repousser de
# commit, par exemple après avoir changé un secret côté Cloudflare.
on:
  push:
    branches:
      - claude/rendle-projet-fonctionnel-7x691w
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build du frontend
        run: npm run build

      # Publie le Worker + les assets statiques (dist/).
      - name: Déployer le Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Applique les 3 secrets via la CLI (wrangler secret put), la seule
      # méthode fiable constatée sur ce projet — le dashboard Cloudflare
      # ("Variables et secrets") ne les liait pas au Worker lors des
      # déploiements Git-connectés (bindings "Vars:" absents des logs,
      # déjà rencontré avec l'ancien APP_SECRET). Les valeurs vivent ici
      # comme secrets GitHub (chiffrés, jamais affichés dans les logs) —
      # à définir une seule fois dans Settings > Secrets and variables >
      # Actions du dépôt : SITE_ACCESS_CODE, MANAGER_CODE, SESSION_SECRET.
      - name: Appliquer les secrets du Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.SITE_ACCESS_CODE }}" | npx wrangler secret put SITE_ACCESS_CODE
          echo "${{ secrets.MANAGER_CODE }}" | npx wrangler secret put MANAGER_CODE
          echo "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET
