name = "pilotagebw"
main = "worker/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "STORAGE_KV"
id = "0dd4bdb5eaa345f190605693ea883e25"

# APP_SECRET n'est pas un vrai secret : sa valeur finit de toute façon en
# clair dans le bundle JS public via VITE_APP_SECRET (même valeur, à
# définir côté dashboard Cloudflare comme variable de build). Sert
# uniquement à fermer l'accès direct à l'API pour un visiteur non passé
# par l'application — voir README > Sécurité.
#
# MANAGER_CODE, en revanche, N'EST JAMAIS envoyé au navigateur : il est
# vérifié côté Worker (POST /api/verify-manager-code) et reste donc un
# vrai secret côté serveur, contrairement à l'ancienne comparaison faite
# directement dans le code client. Change cette valeur à volonté — les
# comptes responsables déjà créés ne sont pas affectés (le code ne sert
# qu'à la création/passage au rôle responsable).
[vars]
APP_SECRET = "3141ac7198c6187c079a95af77e482668952eacc1e1941b9"
MANAGER_CODE = "RESPONSABLE2026"
