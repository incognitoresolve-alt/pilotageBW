name = "suivi-commercial"
main = "worker/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Créé avec `wrangler kv namespace create STORAGE_KV`, puis coller l'id
# retourné ci-dessous (voir README > Déploiement sur Cloudflare).
[[kv_namespaces]]
binding = "STORAGE_KV"
id = "REMPLACER_PAR_L_ID_DU_NAMESPACE_KV"
