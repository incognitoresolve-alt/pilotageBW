name = "pilotagebw"
main = "worker/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "STORAGE_KV"
id = "0dd4bdb5eaa345f190605693ea883e25"

# Aucun secret ici : SITE_ACCESS_CODE, MANAGER_CODE et SESSION_SECRET sont
# tous les trois vérifiés (ou utilisés pour signer) côté Worker et ne
# doivent JAMAIS être présents en clair dans ce fichier — [vars] est un
# fichier committé dans Git, donc public dès que le dépôt est cloné. Ils se
# définissent avec `wrangler secret put <NOM>` (production) et, pour le
# développement local (`wrangler dev`), dans un fichier `.dev.vars` — voir
# `.dev.vars.example` et README > Sécurité.
